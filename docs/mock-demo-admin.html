<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园食堂订餐系统 - 管理员端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #f5576c;
        }

        .main-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .main-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .date-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .date-selector input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* 表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .data-table th,
        .data-table td {
            padding: 15px;
            text-align: left;
        }

        .data-table tbody tr {
            border-bottom: 1px solid #f0f0f0;
        }

        .data-table tbody tr:hover {
            background: #f9f9f9;
        }

        /* 图表容器 */
        .chart-container {
            margin-top: 20px;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 15px;
            height: 300px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 12px;
        }

        .bar-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bar {
            width: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 8px 8px 0 0;
            transition: height 0.5s ease;
            min-height: 20px;
        }

        .bar-label {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        .bar-value {
            font-size: 14px;
            font-weight: 600;
            color: #f5576c;
            margin-bottom: 5px;
        }

        /* 订单列表 */
        .order-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .order-item {
            padding: 15px;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-info {
            flex: 1;
        }

        .order-info strong {
            color: #333;
        }

        .order-status {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: #fff3cd;
            color: #856404;
        }

        /* Mock 环境标识 */
        .mock-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff6b6b;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.4);
            z-index: 1000;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading.hidden {
            display: none;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <!-- Mock 环境标识 -->
    <div class="mock-badge">🔧 Mock Environment - Admin</div>

    <div class="container">
        <div class="header">
            <h1>📊 校园食堂管理系统 - 管理员端</h1>
            <p class="subtitle">「光盘」行动智能推荐 - 数据统计与报表</p>
        </div>

        <!-- 提示消息 -->
        <div id="alert" class="alert"></div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>订餐总人数</h3>
                <div class="stat-value" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>订单总数</h3>
                <div class="stat-value" id="totalOrders">-</div>
            </div>
            <div class="stat-card">
                <h3>总营业额</h3>
                <div class="stat-value" id="totalRevenue">¥-</div>
            </div>
            <div class="stat-card">
                <h3>统计日期</h3>
                <div class="stat-value" style="font-size: 18px;" id="statsDate">-</div>
            </div>
        </div>

        <!-- 菜品需求统计 -->
        <div class="main-card">
            <h2>🍽️ 各菜品需求量统计</h2>
            <div class="date-selector">
                <label>选择日期:</label>
                <input type="date" id="statsDateInput">
                <button class="btn" onclick="loadStatistics()">查询统计</button>
            </div>
            <div id="chartLoading" class="loading">
                <p>加载统计数据中...</p>
            </div>
            <div id="chartContainer" class="chart-container" style="display: none;">
                <div class="bar-chart" id="barChart"></div>
            </div>

            <div style="margin-top: 30px;">
                <h3 style="margin-bottom: 15px;">详细数据表</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>菜品ID</th>
                            <th>菜品名称</th>
                            <th>总需求量</th>
                            <th>整份</th>
                            <th>半份</th>
                            <th>总收入</th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center; color: #666;">暂无数据</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 订单列表 -->
        <div class="main-card">
            <h2>📦 所有订单列表</h2>
            <div id="ordersLoading" class="loading">
                <p>加载订单数据中...</p>
            </div>
            <div id="ordersList" class="order-list"></div>
        </div>
    </div>

    <script>
        // ==================== Mock API 配置 ====================
        const API_BASE_URL = 'http://localhost:4010';
        const USE_LOCAL_MOCK = true;

        // 管理员模拟数据
        const ADMIN_MOCK_DATA = {
            statistics: {
                date: new Date().toISOString().split('T')[0],
                totalOrders: 45,
                totalUsers: 38,
                totalRevenue: 520.00,
                dishes: [
                    {
                        dishId: 'D001',
                        dishName: '红烧肉',
                        totalQuantity: 15,
                        wholePortion: 12,
                        halfPortion: 3,
                        totalRevenue: 180.00
                    },
                    {
                        dishId: 'D002',
                        dishName: '宫保鸡丁',
                        totalQuantity: 10,
                        wholePortion: 8,
                        halfPortion: 2,
                        totalRevenue: 100.00
                    },
                    {
                        dishId: 'D003',
                        dishName: '麻婆豆腐',
                        totalQuantity: 8,
                        wholePortion: 5,
                        halfPortion: 3,
                        totalRevenue: 48.00
                    },
                    {
                        dishId: 'D004',
                        dishName: '番茄蛋汤',
                        totalQuantity: 12,
                        wholePortion: 12,
                        halfPortion: 0,
                        totalRevenue: 48.00
                    },
                    {
                        dishId: 'D005',
                        dishName: '米饭',
                        totalQuantity: 35,
                        wholePortion: 35,
                        halfPortion: 0,
                        totalRevenue: 70.00
                    },
                    {
                        dishId: 'D006',
                        dishName: '凉拌黄瓜',
                        totalQuantity: 6,
                        wholePortion: 4,
                        halfPortion: 2,
                        totalRevenue: 30.00
                    }
                ]
            },
            orders: [
                {
                    id: 'ORD0001',
                    userId: 'U001',
                    userName: '张三',
                    dishName: '红烧肉',
                    portion: 'WHOLE',
                    price: 12.00,
                    status: 'PENDING',
                    orderDate: new Date().toISOString().split('T')[0]
                },
                {
                    id: 'ORD0002',
                    userId: 'U002',
                    userName: '李四',
                    dishName: '宫保鸡丁',
                    portion: 'HALF',
                    price: 5.00,
                    status: 'PENDING',
                    orderDate: new Date().toISOString().split('T')[0]
                },
                {
                    id: 'ORD0003',
                    userId: 'U003',
                    userName: '王五',
                    dishName: '麻婆豆腐',
                    portion: 'WHOLE',
                    price: 6.00,
                    status: 'PENDING',
                    orderDate: new Date().toISOString().split('T')[0]
                }
            ]
        };

        // ==================== 工具函数 ====================
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert show ${type}`;
            setTimeout(() => {
                alert.className = 'alert';
            }, 3000);
        }

        async function mockFetch(url, options = {}) {
            if (!USE_LOCAL_MOCK) {
                return fetch(url, options);
            }

            await new Promise(resolve => setTimeout(resolve, 500));

            const path = url.replace(API_BASE_URL, '');

            // 模拟统计接口
            if (path.includes('/admin/orders/statistics')) {
                return {
                    ok: true,
                    json: async () => ({
                        success: true,
                        data: ADMIN_MOCK_DATA.statistics
                    })
                };
            }

            // 模拟订单列表接口
            if (path.includes('/admin/orders')) {
                return {
                    ok: true,
                    json: async () => ({
                        success: true,
                        data: ADMIN_MOCK_DATA.orders
                    })
                };
            }

            return {
                ok: false,
                json: async () => ({
                    success: false,
                    message: 'Not Found',
                    code: 404
                })
            };
        }

        // ==================== 统计功能 ====================
        async function loadStatistics() {
            const dateInput = document.getElementById('statsDateInput');
            const chartLoading = document.getElementById('chartLoading');
            const chartContainer = document.getElementById('chartContainer');
            const tableBody = document.getElementById('statsTableBody');

            chartLoading.classList.remove('hidden');
            chartContainer.style.display = 'none';

            try {
                const response = await mockFetch(
                    `${API_BASE_URL}/admin/orders/statistics?date=${dateInput.value}`
                );
                const data = await response.json();

                chartLoading.classList.add('hidden');

                if (data.success) {
                    const stats = data.data;
                    
                    // 更新统计卡片
                    document.getElementById('totalUsers').textContent = stats.totalUsers;
                    document.getElementById('totalOrders').textContent = stats.totalOrders;
                    document.getElementById('totalRevenue').textContent = `¥${stats.totalRevenue.toFixed(2)}`;
                    document.getElementById('statsDate').textContent = stats.date;

                    // 渲染柱状图
                    renderBarChart(stats.dishes);
                    
                    // 渲染表格
                    renderStatsTable(stats.dishes);

                    chartContainer.style.display = 'block';
                    showAlert('统计数据加载成功');
                } else {
                    showAlert('统计数据加载失败', 'error');
                }
            } catch (error) {
                chartLoading.classList.add('hidden');
                showAlert('网络错误', 'error');
                console.error('Load statistics error:', error);
            }
        }

        function renderBarChart(dishes) {
            const barChart = document.getElementById('barChart');
            const maxQuantity = Math.max(...dishes.map(d => d.totalQuantity));

            barChart.innerHTML = dishes.map(dish => {
                const height = (dish.totalQuantity / maxQuantity) * 200;
                return `
                    <div class="bar-item">
                        <div class="bar-value">${dish.totalQuantity}</div>
                        <div class="bar" style="height: ${height}px;"></div>
                        <div class="bar-label">${dish.dishName}</div>
                    </div>
                `;
            }).join('');
        }

        function renderStatsTable(dishes) {
            const tableBody = document.getElementById('statsTableBody');
            
            tableBody.innerHTML = dishes.map(dish => `
                <tr>
                    <td>${dish.dishId}</td>
                    <td>${dish.dishName}</td>
                    <td>${dish.totalQuantity}</td>
                    <td>${dish.wholePortion}</td>
                    <td>${dish.halfPortion}</td>
                    <td>¥${dish.totalRevenue.toFixed(2)}</td>
                </tr>
            `).join('');
        }

        // ==================== 订单列表 ====================
        async function loadOrders() {
            const loading = document.getElementById('ordersLoading');
            const list = document.getElementById('ordersList');

            loading.classList.remove('hidden');

            try {
                const response = await mockFetch(`${API_BASE_URL}/admin/orders`);
                const data = await response.json();

                loading.classList.add('hidden');

                if (data.success && data.data.length > 0) {
                    list.innerHTML = data.data.map(order => `
                        <div class="order-item">
                            <div class="order-info">
                                <strong>${order.userName}</strong> 订购了 
                                <strong>${order.dishName}</strong> - ${order.portion === 'WHOLE' ? '整份' : '半份'}
                                <div style="font-size: 12px; color: #666; margin-top: 5px;">
                                    订单号: ${order.id} | ¥${order.price.toFixed(2)}
                                </div>
                            </div>
                            <div class="order-status">${order.status === 'PENDING' ? '待确认' : order.status}</div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p style="color: #666; text-align: center;">暂无订单</p>';
                }
            } catch (error) {
                loading.classList.add('hidden');
                list.innerHTML = '<p style="color: #666; text-align: center;">加载失败</p>';
                console.error('Load orders error:', error);
            }
        }

        // ==================== 初始化 ====================
        window.addEventListener('DOMContentLoaded', () => {
            // 设置默认日期为明天
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('statsDateInput').value = tomorrow.toISOString().split('T')[0];

            console.log('🔧 Mock Admin Environment Initialized');
            console.log('📡 API Base URL:', API_BASE_URL);

            // 自动加载数据
            loadStatistics();
            loadOrders();
        });
    </script>
</body>
</html>
