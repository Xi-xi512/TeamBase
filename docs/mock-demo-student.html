<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园食堂订餐系统 - 学生端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* 登录表单 */
        .login-form {
            max-width: 400px;
            margin: 0 auto 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 用户信息 */
        .user-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info.hidden {
            display: none;
        }

        .logout-btn {
            width: auto;
            padding: 8px 20px;
            font-size: 14px;
        }

        /* 菜品列表 */
        .dishes-section {
            margin-top: 30px;
        }

        .dishes-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .dishes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .dish-card {
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .dish-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .dish-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .dish-category {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

        .dish-price {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }

        .dish-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .portion-select {
            margin-bottom: 15px;
        }

        .portion-select label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }

        .portion-select select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .order-btn {
            width: 100%;
            padding: 10px;
            font-size: 14px;
        }

        /* 订单列表 */
        .orders-section {
            margin-top: 30px;
        }

        .orders-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .order-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-info {
            flex: 1;
        }

        .order-info strong {
            color: #333;
        }

        .order-status {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .order-status.PENDING {
            background: #fff3cd;
            color: #856404;
        }

        .order-status.CONFIRMED {
            background: #d4edda;
            color: #155724;
        }

        /* 提示消息 */
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading.hidden {
            display: none;
        }

        /* Mock 环境标识 */
        .mock-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff6b6b;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.4);
        }
    </style>
</head>
<body>
    <!-- Mock 环境标识 -->
    <div class="mock-badge">🔧 Mock Environment</div>

    <div class="container">
        <h1>🍽️ 校园食堂订餐系统</h1>
        <p class="subtitle">「光盘」行动智能推荐 - 学生端</p>

        <!-- 提示消息 -->
        <div id="alert" class="alert"></div>

        <!-- 登录表单 -->
        <div id="loginSection" class="login-form">
            <div class="form-group">
                <label for="username">账号</label>
                <input type="text" id="username" placeholder="请输入账号（如: stu1）" value="stu1">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" value="123456">
            </div>
            <button class="btn" onclick="handleLogin()">登录</button>
        </div>

        <!-- 用户信息 -->
        <div id="userInfo" class="user-info hidden">
            <div>
                <strong>欢迎，<span id="userName"></span></strong>
                <div style="font-size: 12px; margin-top: 5px; opacity: 0.9;">
                    学号: <span id="userId"></span> | 角色: 学生
                </div>
            </div>
            <button class="btn logout-btn" onclick="handleLogout()">退出登录</button>
        </div>

        <!-- 菜品列表 -->
        <div id="dishesSection" class="dishes-section hidden">
            <h2>📋 明日菜品列表</h2>
            <div id="dishesLoading" class="loading">
                <p>加载中...</p>
            </div>
            <div id="dishesGrid" class="dishes-grid"></div>
        </div>

        <!-- 订单列表 -->
        <div id="ordersSection" class="orders-section hidden">
            <h2>📦 我的订单</h2>
            <div id="ordersList"></div>
        </div>
    </div>

    <script>
        // ==================== Mock API 配置 ====================
        // 使用 Prism Mock 服务器地址
        const API_BASE_URL = 'http://localhost:4010';
        
        // 如果 Mock 服务器未启动，使用本地模拟数据
        const USE_LOCAL_MOCK = true;

        // 本地模拟数据
        const MOCK_DATA = {
            user: {
                id: 'U001',
                username: 'stu1',
                name: '张三',
                role: 'STUDENT'
            },
            dishes: [
                {
                    id: 'D001',
                    name: '红烧肉',
                    category: '热菜',
                    price: 12.00,
                    description: '经典红烧猪肉，肥而不腻',
                    available: true,
                    supportsHalfPortion: true
                },
                {
                    id: 'D002',
                    name: '宫保鸡丁',
                    category: '热菜',
                    price: 10.00,
                    description: '经典川菜，花生香脆',
                    available: true,
                    supportsHalfPortion: true
                },
                {
                    id: 'D003',
                    name: '麻婆豆腐',
                    category: '素食',
                    price: 6.00,
                    description: '麻辣鲜香，下饭好菜',
                    available: true,
                    supportsHalfPortion: true
                },
                {
                    id: 'D004',
                    name: '番茄蛋汤',
                    category: '汤类',
                    price: 4.00,
                    description: '酸甜可口，营养丰富',
                    available: true,
                    supportsHalfPortion: false
                },
                {
                    id: 'D005',
                    name: '米饭',
                    category: '主食',
                    price: 2.00,
                    description: '优质东北大米',
                    available: true,
                    supportsHalfPortion: false
                },
                {
                    id: 'D006',
                    name: '凉拌黄瓜',
                    category: '凉菜',
                    price: 5.00,
                    description: '清爽解腻，夏日必备',
                    available: true,
                    supportsHalfPortion: true
                }
            ],
            orders: []
        };

        // ==================== 状态管理 ====================
        let currentUser = null;
        let currentToken = null;

        // ==================== 工具函数 ====================
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert show ${type}`;
            setTimeout(() => {
                alert.className = 'alert';
            }, 3000);
        }

        async function mockFetch(url, options = {}) {
            if (!USE_LOCAL_MOCK) {
                return fetch(url, options);
            }

            // 模拟网络延迟
            await new Promise(resolve => setTimeout(resolve, 500));

            const path = url.replace(API_BASE_URL, '');
            
            // 模拟登录接口
            if (path === '/auth/login' && options.method === 'POST') {
                const body = JSON.parse(options.body);
                if (body.username && body.password === '123456') {
                    return {
                        ok: true,
                        json: async () => ({
                            success: true,
                            token: 'mock-jwt-token-' + Date.now(),
                            user: MOCK_DATA.user
                        })
                    };
                } else {
                    return {
                        ok: false,
                        json: async () => ({
                            success: false,
                            message: '账号或密码错误',
                            code: 401
                        })
                    };
                }
            }

            // 模拟获取菜品列表
            if (path === '/dishes' && (!options.method || options.method === 'GET')) {
                return {
                    ok: true,
                    json: async () => ({
                        success: true,
                        data: MOCK_DATA.dishes
                    })
                };
            }

            // 模拟创建订单
            if (path === '/orders' && options.method === 'POST') {
                const body = JSON.parse(options.body);
                const dish = MOCK_DATA.dishes.find(d => d.id === body.dishId);
                const newOrder = {
                    id: 'ORD' + String(MOCK_DATA.orders.length + 1).padStart(4, '0'),
                    userId: MOCK_DATA.user.id,
                    userName: MOCK_DATA.user.name,
                    dishId: body.dishId,
                    dishName: dish.name,
                    portion: body.portion,
                    price: body.portion === 'HALF' ? dish.price * 0.5 : dish.price,
                    status: 'PENDING',
                    orderDate: new Date().toISOString().split('T')[0],
                    createdAt: new Date().toISOString()
                };
                MOCK_DATA.orders.push(newOrder);
                return {
                    ok: true,
                    json: async () => ({
                        success: true,
                        message: '订单创建成功',
                        data: newOrder
                    })
                };
            }

            // 模拟获取我的订单
            if (path === '/orders' && (!options.method || options.method === 'GET')) {
                return {
                    ok: true,
                    json: async () => ({
                        success: true,
                        data: MOCK_DATA.orders
                    })
                };
            }

            // 默认返回 404
            return {
                ok: false,
                json: async () => ({
                    success: false,
                    message: 'Not Found',
                    code: 404
                })
            };
        }

        // ==================== 登录功能 ====================
        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showAlert('请输入账号和密码', 'error');
                return;
            }

            try {
                const response = await mockFetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = data.user;
                    currentToken = data.token;
                    showAlert('登录成功！');
                    showMainUI();
                } else {
                    showAlert(data.message || '登录失败', 'error');
                }
            } catch (error) {
                showAlert('网络错误，请稍后重试', 'error');
                console.error('Login error:', error);
            }
        }

        function handleLogout() {
            currentUser = null;
            currentToken = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('dishesSection').classList.add('hidden');
            document.getElementById('ordersSection').classList.add('hidden');
            showAlert('已退出登录', 'success');
        }

        // ==================== 主界面 ====================
        function showMainUI() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('dishesSection').classList.remove('hidden');
            document.getElementById('ordersSection').classList.remove('hidden');

            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('userId').textContent = currentUser.id;

            loadDishes();
            loadOrders();
        }

        // ==================== 菜品功能 ====================
        async function loadDishes() {
            const loading = document.getElementById('dishesLoading');
            const grid = document.getElementById('dishesGrid');
            
            loading.classList.remove('hidden');

            try {
                const response = await mockFetch(`${API_BASE_URL}/dishes?available=true`);
                const data = await response.json();

                loading.classList.add('hidden');

                if (data.success) {
                    grid.innerHTML = data.data.map(dish => createDishCard(dish)).join('');
                } else {
                    grid.innerHTML = '<p style="color: #666;">加载失败</p>';
                }
            } catch (error) {
                loading.classList.add('hidden');
                grid.innerHTML = '<p style="color: #666;">网络错误</p>';
                console.error('Load dishes error:', error);
            }
        }

        function createDishCard(dish) {
            return `
                <div class="dish-card">
                    <div class="dish-name">${dish.name}</div>
                    <div class="dish-category">${dish.category}</div>
                    <div class="dish-price">¥${dish.price.toFixed(2)}</div>
                    <div class="dish-description">${dish.description}</div>
                    ${dish.supportsHalfPortion ? `
                        <div class="portion-select">
                            <label>选择份量:</label>
                            <select id="portion-${dish.id}">
                                <option value="WHOLE">整份 - ¥${dish.price.toFixed(2)}</option>
                                <option value="HALF">半份 - ¥${(dish.price * 0.5).toFixed(2)}</option>
                            </select>
                        </div>
                    ` : ''}
                    <button class="btn order-btn" onclick="handleOrder('${dish.id}')">
                        立即订购
                    </button>
                </div>
            `;
        }

        async function handleOrder(dishId) {
            if (!currentUser) {
                showAlert('请先登录', 'error');
                return;
            }

            const portionSelect = document.getElementById(`portion-${dishId}`);
            const portion = portionSelect ? portionSelect.value : 'WHOLE';

            try {
                const response = await mockFetch(`${API_BASE_URL}/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({
                        dishId,
                        portion,
                        quantity: 1,
                        date: new Date().toISOString().split('T')[0]
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('订单创建成功！');
                    loadOrders();
                } else {
                    showAlert(data.message || '订单创建失败', 'error');
                }
            } catch (error) {
                showAlert('网络错误，请稍后重试', 'error');
                console.error('Order error:', error);
            }
        }

        // ==================== 订单功能 ====================
        async function loadOrders() {
            const list = document.getElementById('ordersList');

            try {
                const response = await mockFetch(`${API_BASE_URL}/orders`, {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    list.innerHTML = data.data.map(order => `
                        <div class="order-item">
                            <div class="order-info">
                                <strong>${order.dishName}</strong> - ${order.portion === 'WHOLE' ? '整份' : '半份'}
                                <div style="font-size: 12px; color: #666; margin-top: 5px;">
                                    订单号: ${order.id} | ¥${order.price.toFixed(2)}
                                </div>
                            </div>
                            <div class="order-status ${order.status}">
                                ${order.status === 'PENDING' ? '待确认' : order.status}
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p style="color: #666; text-align: center;">暂无订单</p>';
                }
            } catch (error) {
                list.innerHTML = '<p style="color: #666; text-align: center;">加载失败</p>';
                console.error('Load orders error:', error);
            }
        }

        // ==================== 初始化 ====================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🔧 Mock Environment Initialized');
            console.log('📡 API Base URL:', API_BASE_URL);
            console.log('📦 Using Local Mock:', USE_LOCAL_MOCK);
        });
    </script>
</body>
</html>
