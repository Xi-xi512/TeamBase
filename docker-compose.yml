version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: canteen-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 050512
      MYSQL_DATABASE: canteen
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./canteen-server/src/main/resources/db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p050512"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./canteen-server
      dockerfile: Dockerfile
    container_name: canteen-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/canteen?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 050512
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
