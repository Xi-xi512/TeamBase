name: Java CI - Canteen System

on:
  push:
    branches: [ develop, main, master, dev-zheng ]
  pull_request:
    branches: [ develop, main, master, dev-zheng ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build project
      run: |
        cd canteen-system
        mkdir -p out
        # 自动查找所有 Java 文件，避免手动列出路径出错
        find src -name "*.java" > sources.txt
        javac -d out -encoding UTF-8 @sources.txt

    - name: Verify compilation
      run: |
        if [ -d "canteen-system/out/com/canteen" ]; then
          echo "✅ Build successful!"
        else
          echo "❌ Build failed!"
          exit 1
        fi
