name: CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # 去掉 cache 配置，避免它在根目录找锁文件

      - name: Build and test backend
        working-directory: ./canteen-server
        run: |
          mvn clean test

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build