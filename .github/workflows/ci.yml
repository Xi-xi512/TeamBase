name: CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build and test backend
        working-directory: ./canteen-server
        run: mvn clean test -Dtest='!CanteenApiIntegrationTest'

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start MySQL
        run: |
          docker run -d --name mysql \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            -e MYSQL_DATABASE=canteen \
            -p 3306:3306 \
            mysql:8.0 \
            --default-authentication-plugin=mysql_native_password
          for i in $(seq 1 30); do
            if docker exec mysql mysqladmin ping -h localhost -u root --silent 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            sleep 2
          done
          # 设置 root 密码 + mysql_native_password，让 JDBC 能连
          docker exec mysql mysql -u root -e "
            ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '050512';
            CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED WITH mysql_native_password BY '050512';
            GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
          "

      - name: Init database
        run: |
          docker exec mysql mysql -u root -p050512 -e "CREATE DATABASE IF NOT EXISTS canteen DEFAULT CHARACTER SET utf8mb4;"
          docker exec -i mysql mysql -u root -p050512 canteen < canteen-server/src/main/resources/db.sql

      - name: Verify tables
        run: docker exec mysql mysql -u root -p050512 canteen -e "SHOW TABLES;"

      - name: Run integration tests
        working-directory: ./canteen-server
        run: mvn test -Dtest=CanteenApiIntegrationTest -DfailIfNoTests=false -Djacoco.skip=true

      - name: Run integration tests
        working-directory: ./canteen-server
        run: mvn test -Dtest=CanteenApiIntegrationTest -DfailIfNoTests=false -Djacoco.skip=true

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    # 只在 push 到 develop 时构建推送镜像，PR 触发时跳过
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./canteen-server
          push: true
          tags: |
            ghcr.io/xi-xi512/canteen-server:latest
            ghcr.io/xi-xi512/canteen-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
