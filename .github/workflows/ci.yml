name: CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build and test backend
        working-directory: ./canteen-server
        run: mvn clean test

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

  integration-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 050512
          MYSQL_DATABASE: canteen
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -p050512"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Init database schema
        run: |
          mysql -h 127.0.0.1 -u root -p050512 canteen < canteen-server/src/main/resources/db.sql

      - name: Run integration tests
        working-directory: ./canteen-server
        run: mvn test -Dtest=CanteenApiIntegrationTest -DfailIfNoTests=false

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    # 只在 push 到 develop 时构建推送镜像，PR 触发时跳过
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./canteen-server
          push: true
          tags: |
            ghcr.io/xi-xi512/canteen-server:latest
            ghcr.io/xi-xi512/canteen-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
