name: CI Pipeline

on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven  # 加速依赖下载，不会报错

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # 加速前端下载

      - name: Build and test backend
        working-directory: ./canteen-server
        run: |
          mvn clean test

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build